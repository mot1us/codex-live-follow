name: Bug report
description: Report an installation or Live Follow behavior problem
body:
  - type: input
    id: versions
    attributes:
      label: Extension version and VS Code version
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Operating system
      options:
        - macOS
        - Windows
        - Linux
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: What happened and how to reproduce it
      description: Include your replay mode and whether the folder is local. Use disposable code and avoid private source or paths.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
